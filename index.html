<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AG1</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0b14;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Engine (local copy, no network needed) -->
  <script src="lib/phaser.min.js"></script>

  <!-- Data -->
  <script src="src/data/weapons.js"></script>
  <script src="src/data/enemies.js"></script>
  <script src="src/data/levels.js"></script>
  <script src="src/data/gear.js"></script>
  <script src="src/data/sprites.js"></script>

  <!-- Systems -->
  <script src="src/systems/SaveManager.js"></script>
  <script src="src/systems/Sound.js"></script>
  <script src="src/systems/Shaders.js"></script>

  <!-- Entities -->
  <script src="src/entities/Projectile.js"></script>
  <script src="src/entities/Pickup.js"></script>
  <script src="src/entities/Enemy.js"></script>
  <script src="src/entities/Boss.js"></script>
  <script src="src/entities/Player.js"></script>

  <!-- Scenes -->
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/UIScene.js"></script>
  <script src="src/scenes/PauseScene.js"></script>
  <script src="src/scenes/ShopScene.js"></script>
  <script src="src/scenes/WinScene.js"></script>
  <script src="src/scenes/LeaderboardScene.js"></script>

  <!-- Boot -->
  <script src="src/main.js"></script>
</body>
</html>
